name: Secret Scan

on:
  pull_request:
    branches: [main]

jobs:
  gitleaks:
    name: Detect secrets (gitleaks)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          # Full history needed for accurate diff-based PR scanning.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is required for organisation-owned repos.
          # This repo is personal — no license needed.
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
