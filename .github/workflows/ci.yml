name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-progress runs for the same ref on new push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── API (Python 3.12) ──────────────────────────────────────────────────────
  api:
    name: API (Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff check)
        run: ruff check src tests

      - name: Format check (ruff format --check)
        run: ruff format --check src tests

      - name: Type check (mypy)
        run: mypy src

      - name: Security scan (bandit)
        run: bandit -r src/ -c pyproject.toml

      - name: Test (pytest + coverage)
        run: pytest --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-coverage
          path: apps/api/coverage.xml
          retention-days: 7

  # ── Web (Node 20) ──────────────────────────────────────────────────────────
  web:
    name: Web (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        # --if-present exits 0 when no "test" script is defined in package.json.
        run: npm run test --if-present

  # ── eval-quick (path-filtered) ────────────────────────────────────────────
  # Regression gate: runs a 20-example subset of the agent golden datasets.
  # Fails CI on >2% drop on any metric. Path-filtered so it only runs when
  # agent logic, LLM wiring, or eval datasets change.
  #
  # Currently a dry-run placeholder — becomes load-bearing in Phase C when
  # agents and golden datasets land. continue-on-error: false is intentional.
  eval-quick:
    name: Eval quick (dry run)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Eval quick (dry run — agents not yet implemented)
        run: |
          python -c "
          import sys
          print('eval-quick: no agents implemented yet (Phase C). '
                'This job becomes load-bearing when evals/datasets/ is populated.')
          sys.exit(0)
          "
