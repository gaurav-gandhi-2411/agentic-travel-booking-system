name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-progress runs for the same ref on new push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── API (Python 3.12) ──────────────────────────────────────────────────────
  api:
    name: API (Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff check)
        run: ruff check src tests

      - name: Format check (ruff format --check)
        run: ruff format --check src tests

      - name: Type check (mypy)
        run: mypy src

      - name: Security scan (bandit)
        run: bandit -r src/ -c pyproject.toml

      - name: Test (pytest + coverage)
        run: pytest --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-coverage
          path: apps/api/coverage.xml
          retention-days: 7

  # ── Web (Node 20) ──────────────────────────────────────────────────────────
  web:
    name: Web (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        # --if-present exits 0 when no "test" script is defined in package.json.
        run: npm run test --if-present

  # ── eval-quick (path-filtered) ────────────────────────────────────────────
  # Regression gate: 20-example PlannerAgent golden set via VCR cassette replay.
  # Fails CI if field-level accuracy drops below 95%.
  # Path-filtered to run only when agent code, LLM wiring, or eval datasets change.
  eval-quick:
    name: Eval quick (planner golden set)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Eval quick (VCR replay, threshold 95%)
        run: python -m evals.run --dataset planner --threshold 0.95

  # ── eval-tier1-wave2 ─────────────────────────────────────────────────────
  # Wave 2 Tier-1: deterministic planner field accuracy + refine constraints.
  # Reads committed JSONL baseline from evals/wave2/runs/. If no baseline file
  # exists the scorer exits 0 (graceful skip until first baseline is committed).
  # Threshold: 80% required-field accuracy. Re-tighten after baseline is locked.
  eval-tier1-wave2:
    name: Eval tier1-wave2 (planner + refine, no LLM)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Tier-1 score (deterministic, threshold 80%)
        run: python -m evals.wave2.scorer --threshold 0.80

  manifest-provenance:
    # 2026-08-05 audit: a metric in .portfolio/metrics.json without a
    # committed artifact behind it can silently drift from what the portfolio
    # site shows, with nobody able to tell -- this is a build failure, not a
    # warning. See gg-portfolio's provenance.md wave 19 section.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Every manifest metric must have a committed artifact
        run: python scripts/check_manifest_provenance.py
