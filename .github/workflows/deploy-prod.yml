name: Deploy — Production

# ── Required secrets & vars (provision in Stage 0.4) ──────────────────────
# secrets.WIF_PROVIDER          Workload Identity Pool Provider resource name
# secrets.WIF_SERVICE_ACCOUNT   Service account email for impersonation
# vars.GCP_PROJECT_ID           GCP project ID
# vars.CLOUD_RUN_REGION         Cloud Run region, e.g. us-central1
# vars.ARTIFACT_REGISTRY_REPO   Artifact Registry repo name, e.g. travel-agent
# ──────────────────────────────────────────────────────────────────────────

on:
  push:
    tags:
      - 'v*'  # e.g. v1.0.0, v1.2.3-rc1
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual deploy"
        required: true
        type: string
      stage:
        description: "Deploy stage: 'canary' builds the image and deploys at 0% traffic, then stops for manual smoke test; 'full' runs the promotion path (traffic shift → soak → 100%). Ignored on tag push (always runs the full pipeline)."
        required: false
        default: canary
        type: choice
        options:
          - canary
          - full

jobs:
  deploy-prod:
    name: Deploy to Cloud Run (production)

    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write  # Required for Workload Identity Federation

    steps:
      - uses: actions/checkout@v6

      - name: Authenticate to GCP via WIF
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        if: ${{ github.event_name == 'push' || inputs.stage == 'canary' }}
        run: |
          gcloud auth configure-docker \
            ${{ vars.CLOUD_RUN_REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        if: ${{ github.event_name == 'push' || inputs.stage == 'canary' }}
        env:
          IMAGE: ${{ vars.CLOUD_RUN_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REGISTRY_REPO }}/api
          TAG: ${{ github.ref_name }}
        run: |
          docker build \
            --tag "$IMAGE:$TAG" \
            --tag "$IMAGE:${{ github.sha }}" \
            apps/api/
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:${{ github.sha }}"

      - name: Deploy to Cloud Run (production) — canary at 0% traffic
        if: ${{ github.event_name == 'push' || inputs.stage == 'canary' }}
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: agentic-travel-booking-api-prod
          region: ${{ vars.CLOUD_RUN_REGION }}
          image: ${{ vars.CLOUD_RUN_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REGISTRY_REPO }}/api:${{ github.ref_name }}
          tag: canary
          no_traffic: true  # Deploy revision without sending traffic
          env_vars: |
            APP_MODE=demo
            APP_ENV=production
            LLM_ROUTING_PROFILE=demo-llama
            AVIASALES_LIVE=true
          secrets: |
            ANTHROPIC_API_KEY=anthropic-api-key:latest
            AVIASALES_API_KEY=travelpayouts-api-token:latest
            AVIASALES_PARTNER_ID=travelpayouts-aviasales-marker:latest
            DATABASE_URL=supabase-dealhunter-url-prod:latest
            DATABASE_URL_RUNTIME=database-url-runtime-prod:latest
            DEMO_API_KEY=demo-api-key:latest
            GROQ_API_KEY=groq-api-key:latest
            OPENROUTER_API_KEY=openrouter-api-key:latest
            UPSTASH_REDIS_URL=upstash-redis-url:latest
            LANGFUSE_PUBLIC_KEY=langfuse-public-key:latest
            LANGFUSE_SECRET_KEY=langfuse-secret-key:latest
            SENTRY_DSN=sentry-dsn:latest
          flags: |
            --min-instances=1
            --max-instances=20
            --memory=1Gi
            --cpu=1
            --timeout=300
            --concurrency=80

      - name: Shift 5% traffic to canary
        if: ${{ github.event_name == 'push' || inputs.stage == 'full' }}
        run: |
          gcloud run services update-traffic agentic-travel-booking-api-prod \
            --region="${{ vars.CLOUD_RUN_REGION }}" \
            --to-tags=canary=5

      # Automated soak: liveness check only (/health = 200 + status:ok).
      # Correctness — /search, /refine, cache hit, structured logs — is
      # verified manually on the canary revision before triggering stage=full.
      # This soak confirms the revision is alive under real traffic, not correct.
      - name: Soak canary at 5% for 5 minutes
        if: ${{ github.event_name == 'push' || inputs.stage == 'full' }}
        run: |
          echo "Soaking canary revision at 5% traffic for 5 minutes..."
          sleep 300
          URL="https://agentic-travel-booking-api-prod-rqyyasfwaa-el.a.run.app/health"
          STATUS=$(curl -sf "$URL" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status',''))" 2>/dev/null || echo "")
          if [ "$STATUS" != "ok" ]; then
            echo "Health check failed during canary soak — leaving traffic at 5%. Manual rollback required."
            echo "Run: gcloud run services update-traffic agentic-travel-booking-api-prod --region=<REGION> --to-revisions=LATEST=0"
            exit 1
          fi
          echo "Canary soak passed."

      - name: Promote canary to 100%
        if: ${{ github.event_name == 'push' || inputs.stage == 'full' }}
        run: |
          gcloud run services update-traffic agentic-travel-booking-api-prod \
            --region="${{ vars.CLOUD_RUN_REGION }}" \
            --to-latest

      - name: Production health check
        if: ${{ github.event_name == 'push' || inputs.stage == 'full' }}
        run: |
          URL="https://agentic-travel-booking-api-prod-rqyyasfwaa-el.a.run.app/health"
          for i in 1 2 3 4 5; do
            STATUS=$(curl -sf "$URL" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status',''))" 2>/dev/null || echo "")
            if [ "$STATUS" = "ok" ]; then echo "Health check passed"; exit 0; fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "Health check failed after 5 attempts" && exit 1
