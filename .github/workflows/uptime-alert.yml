name: Uptime Alert

# Item 257: DealHunter had zero scheduled monitoring of any kind and zero
# scheduled database activity -- found while auditing the sibling StyleMaitri
# product for the same gap (Item 255). /health here was cache-only until this
# same change added a real `SELECT 1` DB check to it (apps/api/src/
# travel_agent/api/main.py) -- a single endpoint covers both cache and
# database, so unlike StyleMaitri (which needed a second job for a separate
# /readyz) one job/schedule is enough here.
#
# minScale=1 on this service (confirmed via `gcloud run services describe`,
# 2026-08-17) means it never cold-starts from zero -- no need for StyleMaitri's
# generous 75s timeout/retry budget; a standard short timeout is appropriate.
#
# Modeled on review-iq's and StyleMaitri's uptime-alert.yml: always() is
# load-bearing on both alert-handling steps for the same reason documented in
# those files -- a step without it silently no-ops whenever the probe step
# itself errors, instead of running and creating/updating the alert issue.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      test_url_override:
        description: "Override SERVICE_URL for this manual run only (e.g. a deliberately-bad URL, to test the alert path end to end). Leave blank for a normal check."
        required: false
        type: string

concurrency:
  group: dealhunter-uptime-alert
  cancel-in-progress: true

permissions:
  issues: write

env:
  SERVICE_URL: "https://agentic-travel-booking-api-prod-avt76sxhoa-el.a.run.app"
  CHECK_PATH: "/health"
  ALERT_TITLE: "DealHunter prod is DOWN or degraded"
  CURL_TIMEOUT: "15"
  RETRY_SLEEP: "10"

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Probe /health (cache + database)
        id: probe
        env:
          TEST_URL_OVERRIDE: ${{ inputs.test_url_override }}
        run: |
          if [ -n "${TEST_URL_OVERRIDE}" ]; then
            TARGET_URL="${TEST_URL_OVERRIDE}"
            echo "::warning::Using test_url_override for this manual run: ${TARGET_URL}"
          else
            TARGET_URL="${SERVICE_URL}${CHECK_PATH}"
          fi

          probe() {
            HTTP_STATUS=$(curl -s -o /tmp/health_body.txt -w "%{http_code}" \
              --max-time "${CURL_TIMEOUT}" \
              "${TARGET_URL}" 2>/dev/null || echo "000")
            echo "${HTTP_STATUS}"
          }

          STATUS=$(probe)
          echo "First probe: HTTP ${STATUS}"

          if [ "${STATUS}" != "200" ]; then
            echo "Non-200 on first probe. Waiting ${RETRY_SLEEP}s, then retrying..."
            sleep "${RETRY_SLEEP}"
            STATUS=$(probe)
            echo "Retry probe: HTTP ${STATUS}"
          fi

          # Collapse before writing to $GITHUB_OUTPUT -- an embedded newline in the
          # body corrupts a plain key=value line.
          BODY=$(cat /tmp/health_body.txt 2>/dev/null || echo "(no body)")
          BODY_ONELINE=$(printf '%s' "${BODY:0:500}" | tr '\n\r' '  ')
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          echo "status=${STATUS}" >> "$GITHUB_OUTPUT"
          echo "timestamp=${TIMESTAMP}" >> "$GITHUB_OUTPUT"
          echo "target_url=${TARGET_URL}" >> "$GITHUB_OUTPUT"
          echo "body=${BODY_ONELINE}" >> "$GITHUB_OUTPUT"

      - name: Handle DOWN
        if: always() && steps.probe.outputs.status != '200'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HTTP_STATUS: ${{ steps.probe.outputs.status }}
          TIMESTAMP: ${{ steps.probe.outputs.timestamp }}
          BODY: ${{ steps.probe.outputs.body }}
          TARGET_URL: ${{ steps.probe.outputs.target_url }}
        run: |
          REPO="${{ github.repository }}"

          EXISTING_ISSUE=$(gh issue list \
            --repo "${REPO}" \
            --state open \
            --search "\"${ALERT_TITLE}\" in:title" \
            --json number \
            --jq '.[0].number // empty')

          RUN_URL="https://github.com/${REPO}/actions/runs/${{ github.run_id }}"

          if [ -n "${EXISTING_ISSUE}" ]; then
            echo "Existing alert issue #${EXISTING_ISSUE} found. Adding comment."
            gh issue comment "${EXISTING_ISSUE}" \
              --repo "${REPO}" \
              --body "$(cat <<EOF
          Still failing at ${TIMESTAMP}

          **HTTP status:** \`${HTTP_STATUS}\`
          **Checked:** \`${TARGET_URL}\`

          **Response body:**
          \`\`\`
          ${BODY}
          \`\`\`

          [Workflow run](${RUN_URL})
          EOF
          )"
          else
            echo "No existing alert issue found. Creating new issue."
            gh issue create \
              --repo "${REPO}" \
              --title "${ALERT_TITLE}" \
              --body "$(cat <<EOF
          ## DealHunter /health is failing or degraded

          **Detected at:** ${TIMESTAMP}
          **HTTP status:** \`${HTTP_STATUS}\`
          **Checked:** \`${TARGET_URL}\`

          **Response body:**
          \`\`\`
          ${BODY}
          \`\`\`

          ---

          ### Quick triage

          The response body's \`cache\`/\`database\` fields distinguish which
          dependency failed. If \`database: unreachable\`, check whether the
          Supabase project has auto-paused (7-day inactivity) before assuming
          an outage.

          \`\`\`bash
          curl -sf ${SERVICE_URL}${CHECK_PATH} | jq .
          \`\`\`

          [Workflow run that detected this](${RUN_URL})

          ---

          *This issue is managed by the uptime-alert workflow. Do not rename it -- the title is used to deduplicate alerts.*
          EOF
          )" \
              --label "bug"
          fi

          echo "::error::${CHECK_PATH} returned HTTP ${HTTP_STATUS} at ${TIMESTAMP}. See alert issue."
          exit 1

      - name: Handle recovery
        if: always() && steps.probe.outputs.status == '200'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TIMESTAMP: ${{ steps.probe.outputs.timestamp }}
        run: |
          REPO="${{ github.repository }}"

          EXISTING_ISSUE=$(gh issue list \
            --repo "${REPO}" \
            --state open \
            --search "\"${ALERT_TITLE}\" in:title" \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "${EXISTING_ISSUE}" ]; then
            echo "Recovery detected. Closing alert issue #${EXISTING_ISSUE}."
            gh issue comment "${EXISTING_ISSUE}" \
              --repo "${REPO}" \
              --body "**Recovered** at ${TIMESTAMP} -- ${CHECK_PATH} is returning HTTP 200 again."
            gh issue close "${EXISTING_ISSUE}" \
              --repo "${REPO}" \
              --reason "completed"
          else
            echo "${CHECK_PATH} is UP (HTTP 200). No open alert issue to close."
          fi
