name: Deploy — Staging

# ── Required secrets & vars (provision in Stage 0.4) ──────────────────────
# secrets.WIF_PROVIDER          Workload Identity Pool Provider resource name
#                               e.g. projects/123/locations/global/workloadIdentityPools/gh-pool/providers/gh-provider
# secrets.WIF_SERVICE_ACCOUNT   Service account email for impersonation
#                               e.g. github-actions@<PROJECT_ID>.iam.gserviceaccount.com
# vars.GCP_PROJECT_ID           GCP project ID
# vars.CLOUD_RUN_REGION         Cloud Run region, e.g. us-central1
# vars.ARTIFACT_REGISTRY_REPO   Artifact Registry repo name, e.g. travel-agent
# ──────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-staging:
    name: Deploy to Cloud Run (staging)

    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write  # Required for Workload Identity Federation

    steps:
      - uses: actions/checkout@v6

      - name: Authenticate to GCP via WIF
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker \
            ${{ vars.CLOUD_RUN_REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        env:
          IMAGE: ${{ vars.CLOUD_RUN_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REGISTRY_REPO }}/api
        run: |
          docker build \
            --tag "$IMAGE:${{ github.sha }}" \
            --tag "$IMAGE:latest" \
            apps/api/
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Deploy to Cloud Run (staging)
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: agentic-travel-booking-api-staging
          region: ${{ vars.CLOUD_RUN_REGION }}
          image: ${{ vars.CLOUD_RUN_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REGISTRY_REPO }}/api:${{ github.sha }}
          env_vars: |
            APP_ENV=staging
            APP_MODE=demo
            LLM_ROUTING_PROFILE=demo
            AVIASALES_LIVE=true
          secrets: |
            ANTHROPIC_API_KEY=anthropic-api-key:latest
            AVIASALES_API_KEY=travelpayouts-api-token:latest
            AVIASALES_PARTNER_ID=travelpayouts-aviasales-marker:latest
            DEMO_API_KEY=demo-api-key:latest
            GROQ_API_KEY=groq-api-key:latest
            OPENROUTER_API_KEY=openrouter-api-key:latest
            UPSTASH_REDIS_URL=upstash-redis-url:latest
            LANGFUSE_PUBLIC_KEY=langfuse-public-key:latest
            LANGFUSE_SECRET_KEY=langfuse-secret-key:latest
          flags: |
            --min-instances=0
            --max-instances=5
            --memory=1Gi
            --cpu=1
            --timeout=300

      - name: Staging health check
        run: |
          URL=$(gcloud run services describe agentic-travel-booking-api-staging \
            --region="${{ vars.CLOUD_RUN_REGION }}" --project="${{ vars.GCP_PROJECT_ID }}" \
            --format='value(status.url)')
          for i in 1 2 3 4 5; do
            STATUS=$(curl -sf "$URL/health" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status',''))" 2>/dev/null || echo "")
            if [ "$STATUS" = "ok" ]; then echo "Health check passed"; exit 0; fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "Health check failed after 5 attempts" && exit 1
