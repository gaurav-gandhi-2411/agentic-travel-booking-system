name: pip-audit

on:
  schedule:
    - cron: '0 6 * * 1'  # Monday 06:00 UTC
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pip-audit:
    name: pip-audit dependency scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write  # Required to open GitHub issues on failure

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for Python file changes
        id: python_changes
        # On schedule/workflow_dispatch always run. On push/PR, check whether
        # Python-related files changed. If not, exit early — no audit needed.
        run: |
          EVENT="${{ github.event_name }}"
          if [ "$EVENT" = "schedule" ] || [ "$EVENT" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only HEAD~1 HEAD | grep -qE '\.(py|txt|toml)$|uv\.lock'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No Python-related files changed — skipping pip-audit."
          fi

      - name: Set up Python 3.12
        if: steps.python_changes.outputs.changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit and deps
        if: steps.python_changes.outputs.changed == 'true'
        run: |
          pip install pip-audit pip-tools
          # Install project deps so pip-audit can resolve the full graph
          pip install -e "apps/api[dev]"

      - name: Run pip-audit
        id: audit
        if: steps.python_changes.outputs.changed == 'true'
        # Audits all installed packages. Fails (exit 1) if any known
        # vulnerability is found. Adjust --severity if low/medium noise
        # becomes a problem (e.g., --severity high).
        run: pip-audit --desc

      - name: Open GitHub issue on failure
        if: failure() && steps.audit.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Security: pip-audit found vulnerabilities"
          # Avoid duplicate issues — check for any open issue with this title.
          EXISTING=$(
            gh issue list --state open --json title \
              --jq "[.[] | select(.title == \"$TITLE\")] | length"
          )
          if [ "$EXISTING" -eq 0 ]; then
            BODY="pip-audit detected vulnerabilities in \`apps/api/pyproject.toml\` dependencies.

Action required: review the workflow run at $RUN_URL, update affected packages, and close this issue once resolved.

Labels to add manually if not auto-applied: security, dependencies"
            gh issue create --title "$TITLE" --body "$BODY"
          else
            echo "Open issue '$TITLE' already exists — skipping creation."
          fi
