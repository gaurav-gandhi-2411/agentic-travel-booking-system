name: Optimizer Eval

on:
  pull_request:
    types: [labeled]
  schedule:
    - cron: '0 3 * * *'  # nightly 03:00 UTC

jobs:
  eval-optimizer:
    if: >
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' && github.event.label.name == 'run-optimizer-eval')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run optimizer eval (dry-run — no LLM keys required)
        run: python -m evals.optimizer.runner --dry-run --all-profiles

      - name: Score and report
        # TODO(Phase 2C.1 S3 / Issue #8): add --judge-profile eval-judge-qwen3-32b
        # and explicit --run targets so coherence is actually evaluated in CI.
        run: python -m evals.optimizer.scorer --all

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: optimizer-eval-report
          path: apps/api/evals/optimizer/reports/
