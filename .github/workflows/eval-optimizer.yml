name: Optimizer Eval

# Corrected 2026-08-15 (Item 76):
#  - No top-level `permissions:` existed, so "Open failure issue" ran under
#    whatever the repo's default GITHUB_TOKEN permissions are -- which don't
#    include issues:write here, so the failure-notification step failed too
#    (GraphQL: Resource not accessible by integration). 5/5 nightly runs
#    failed silently: no eval result, no issue, no signal at all.
#  - `python -m evals.optimizer.runner`/`scorer` both do
#    `from optimizer.throttle import ...` internally -- a bare top-level
#    import, not `evals.optimizer.throttle`. This resolves fine under pytest
#    (which inserts apps/api/evals onto sys.path via its own rootdir
#    discovery) but NOT under a plain `python -m` invocation, which only
#    puts apps/api itself on sys.path. Reproduced locally
#    (ModuleNotFoundError: No module named 'optimizer') and confirmed the
#    fix: PYTHONPATH=evals (relative to the apps/api working-directory)
#    makes the same bare `optimizer.*` imports resolve, matching pytest's
#    behavior without touching the many files that already use this import
#    convention (6+ files across evals/ and tests/, established pattern, not
#    a one-off typo).

permissions:
  contents: read
  issues: write

on:
  pull_request:
    types: [labeled]
  schedule:
    - cron: '0 3 * * *'  # nightly 03:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # PR smoke test — dry-run, no LLM keys required.
  eval-smoke:
    if: >
      github.event_name == 'pull_request' &&
      github.event.label.name == 'run-optimizer-eval'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      PYTHONPATH: evals

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run optimizer eval (dry-run — no LLM keys required)
        # Default profiles are demo-llama and demo-deepseek-v4 (both free tier).
        # Haiku excluded from defaults — opt-in via --profile demo-haiku when comparing
        # against the paid Anthropic baseline (Phase 2C.1 baseline already proves parity).
        run: python -m evals.optimizer.runner --dry-run --all-profiles

      - name: Score and report
        run: python -m evals.optimizer.scorer --all

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: optimizer-eval-report-smoke
          path: apps/api/evals/optimizer/reports/

  # Nightly eval — real LLM calls, coherence judge, threshold gates.
  eval-nightly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      PYTHONPATH: evals

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run optimizer eval
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: python -m evals.optimizer.runner --all-profiles

      - name: Score and check gates
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: >
          python -m evals.optimizer.scorer
          --all
          --judge-profile eval-judge-qwen3-32b

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optimizer-eval-report-nightly
          path: apps/api/evals/optimizer/reports/

      - name: Open failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPORT_FILE=$(ls -t evals/optimizer/reports/*.md 2>/dev/null | head -1)
          REPORT_BODY=""
          if [ -n "$REPORT_FILE" ]; then
            REPORT_BODY=$(cat "$REPORT_FILE")
          fi
          gh issue create \
            --title "Nightly eval failure $(date -u '+%Y-%m-%d')" \
            --label "nightly-eval-failure" \
            --body "$(printf 'Nightly optimizer eval failed on %s UTC.\n\nWorkflow run: %s\n\n<details><summary>Report</summary>\n\n```\n%s\n```\n</details>' \
              "$(date -u)" \
              "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              "$REPORT_BODY")"
