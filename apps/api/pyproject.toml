[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "travel-agent"
version = "0.1.0"
description = "Agentic Travel Booking System — API backend"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "anthropic>=0.40.0",
    "openai>=1.60.0",
    "pyyaml>=6.0",
    "httpx>=0.28.0",
    "asyncpg>=0.30.0",
    "structlog>=24.4.0",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-instrumentation-httpx>=0.46b0",
    "opentelemetry-exporter-gcp-trace>=1.7.0",
    "alembic>=1.14.0",
    "upstash-redis>=1.3.0",
    "sentry-sdk[fastapi]>=2.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "bandit[toml]>=1.8.0",
    "pip-audit>=2.8.0",
    "vcrpy>=6.0.0",
    "types-PyYAML>=6.0",
    "testcontainers[postgres]>=4.9.0",
    "freezegun>=1.5.0",
]
finetune = [
    "unsloth",
    "transformers>=4.40.0",
    "peft>=0.10.0",
    "datasets>=2.20.0",
    "evaluate>=0.4.0",
    "bitsandbytes>=0.43.0",
    "accelerate>=0.30.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/travel_agent"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "S",        # bandit (security)
    "B",        # bugbear
    "A",        # builtins shadowing
    "C4",       # comprehensions
    "DTZ",      # timezone-aware datetimes
    "T10",      # debugger statements
    "EM",       # error message formatting
    "G",        # logging format
    "PIE",      # misc improvements
    "T20",      # no print statements
    "PT",       # pytest style
    "RSE",      # raise
    "RET",      # return
    "SIM",      # simplify
    "PTH",      # pathlib over os.path
    "PL",       # pylint
    "TRY",      # exception handling
    "RUF",      # ruff-specific
]
ignore = [
    "COM812",   # trailing comma — conflicts with formatter
    "ISC001",   # implicit str concat — conflicts with formatter
    "TRY003",   # long exception messages (too strict for now)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ARG001", "ARG002", "PLR2004", "PLC0415", "A002"]
# Protocol-mandated signatures on LLM adapters exceed the 5-arg default.
"src/travel_agent/llm/**" = ["PLR0913"]
# Provider adapters may have multiple optional search parameters.
"src/travel_agent/providers/**" = ["PLR0913"]
# eval runner is a CLI script; print is the correct output mechanism.
"evals/**" = ["T201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src/travel_agent --cov-report=term-missing"

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]

[tool.coverage.run]
source = ["src/travel_agent"]
omit = ["*/migrations/*"]

[tool.coverage.report]
fail_under = 80
