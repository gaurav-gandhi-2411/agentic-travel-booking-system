# LLM routing config — per-agent model and provider selection.
# Active profile selected via LLM_ROUTING_PROFILE env var (default: local).
# Loaded at runtime by travel_agent.llm.routing.load_routing_config().
#
# Model IDs verified against Anthropic SDK accepted strings (2026-05-14):
#   claude-sonnet-4-6          → Claude Sonnet 4.6
#   claude-haiku-4-5-20251001  → Claude Haiku 4.5

profiles:

  # ── local ────────────────────────────────────────────────────────────────────
  # All agents route to Ollama on localhost. Requires a running Ollama instance.
  # NOTE (2026-06-11): llama3.1:8b used — qwen3:30b-a3b's thinking mode causes
  # empty tool calls with tool_choice="required"; llama3.1:8b has tools without
  # thinking mode and is faster on local hardware.
  local:
    planner:        llama3.1:8b
    flight_hunter:  llama3.1:8b
    hotel_hunter:   llama3.1:8b
    optimizer:      llama3.1:8b
    booking:        llama3.1:8b
    conversation:   llama3.1:8b
    provider:       ollama
    base_url:       http://localhost:11434

  # ── free ─────────────────────────────────────────────────────────────────────
  # OpenRouter free-tier models. Rate-limited (~50 req/day per model on free tier).
  # Groq fallback for narrow agents when OpenRouter is exhausted.
  free:
    planner:        qwen/qwen-2.5-72b-instruct:free
    flight_hunter:  meta-llama/llama-3.3-70b-instruct:free
    hotel_hunter:   meta-llama/llama-3.3-70b-instruct:free
    optimizer:      qwen/qwen-2.5-72b-instruct:free
    booking:        meta-llama/llama-3.3-70b-instruct:free
    conversation:   qwen/qwen-2.5-72b-instruct:free
    provider:       openrouter
    fallback_provider: groq
    # llama-3.3-70b-versatile deprecated by Groq 2026-08-16 (console.groq.com/docs/
    # deprecations); openai/gpt-oss-120b is their documented same-tier replacement.
    fallback_models:
      planner:        openai/gpt-oss-120b
      flight_hunter:  openai/gpt-oss-120b
      hotel_hunter:   openai/gpt-oss-120b
      optimizer:      openai/gpt-oss-120b
      booking:        openai/gpt-oss-120b
      conversation:   openai/gpt-oss-120b

  # ── demo / demo-haiku ────────────────────────────────────────────────────────
  # Live demo profile (premium track). Haiku for all agents.
  # "demo" is kept as the env-default alias; "demo-haiku" is the explicit name
  # used by the X-LLM-Profile header toggle.
  demo:
    planner:        claude-haiku-4-5-20251001
    flight_hunter:  claude-haiku-4-5-20251001
    hotel_hunter:   claude-haiku-4-5-20251001
    optimizer:      claude-haiku-4-5-20251001
    booking:        claude-haiku-4-5-20251001
    conversation:   claude-haiku-4-5-20251001
    provider:       anthropic

  demo-haiku:
    planner:        claude-haiku-4-5-20251001
    flight_hunter:  claude-haiku-4-5-20251001
    hotel_hunter:   claude-haiku-4-5-20251001
    optimizer:      claude-haiku-4-5-20251001
    booking:        claude-haiku-4-5-20251001
    conversation:   claude-haiku-4-5-20251001
    provider:       anthropic

  # ── demo-llama ───────────────────────────────────────────────────────────────
  # Free-tier demo profile. Groq for reasoning agents.
  # Requires GROQ_API_KEY (free at console.groq.com).
  # Activated per-request via X-LLM-Profile: demo-llama header, AND is the actual
  # production default (LLM_ROUTING_PROFILE=demo-llama on the live Cloud Run
  # service, confirmed 2026-08-18) -- this is not merely an opt-in demo path.
  # llama-3.3-70b-versatile / llama-3.1-8b-instant deprecated by Groq 2026-08-16
  # (console.groq.com/docs/deprecations); replaced with their documented
  # same-tier successors, openai/gpt-oss-120b / openai/gpt-oss-20b.
  demo-llama:
    planner:        openai/gpt-oss-120b
    flight_hunter:  openai/gpt-oss-20b
    hotel_hunter:   openai/gpt-oss-20b
    optimizer:      openai/gpt-oss-120b
    booking:        openai/gpt-oss-20b
    conversation:   openai/gpt-oss-120b
    provider:       groq
    # Fallback chain (spec.md, validated 2026-07-04 — see
    # apps/api/scripts/validate_fallback_candidates.py and ADR-0027). On a
    # retryable Groq error (429/timeout/5xx), planner, optimizer, AND
    # conversation (ConversationManagerAgent, the /refine classifier) fall
    # back to OpenRouter's free Gemma-4-31B — the only free candidate that
    # was BOTH schema-clean AND reliably available (vs. every stronger free
    # model tested being either oversubscribed or tool-schema-incompatible).
    #
    # conversation_manager's tool (extract_conversation_action /
    # ConversationManagerOutput) is structurally harder than planner/
    # optimizer's flat objects -- it has an exactly-one-of-three-nested-
    # objects invariant (refine_args/replan_args/no_op_args) enforced by a
    # Pydantic model_validator, not plain JSON Schema. Validated separately
    # (2026-07-04): 3/3 clean across REFINE/REPLAN/NO_OP cases, including the
    # exactly-one-of invariant and the args_summary-required rule. Added to
    # the chain once that passed -- was excluded before this validation ran.
    #
    # OpenRouter Llama-3.3-70B (same model as primary, for quality parity) was
    # evaluated as position #2 and DROPPED: 0/6 successful calls across two
    # validation rounds (100% 429, oversubscribed on OpenRouter's free
    # routing) — it would add a guaranteed-to-fail round-trip on every
    # fallback, which is pure latency on the exact path that fires when we're
    # already degraded.
    fallback_chain:
      planner:
        - provider: openrouter
          model: google/gemma-4-31b-it:free
      optimizer:
        - provider: openrouter
          model: google/gemma-4-31b-it:free
      conversation:
        - provider: openrouter
          model: google/gemma-4-31b-it:free

  # ── demo-deepseek-v4 ─────────────────────────────────────────────────────────
  # NVIDIA NIM profile — DeepSeek-V4-Flash via integrate.api.nvidia.com.
  # Flat model+provider config (no per-agent keys); used by the eval runner
  # both as a standalone profile and as the fallback when Groq hits TPM/TPD
  # quota mid-batch (Issue #15).
  # Free tier: 40 RPM (request-rate limited, not TPM-based).
  # Requires NVIDIA_API_KEY (free dev tier at build.nvidia.com).
  #
  # Model suffix: -flash for free-tier latency. Do not change to -pro without
  # rebenchmarking eval latency budgets (-pro is 1.6T params vs 284B for -flash).
  demo-deepseek-v4:
    provider:    nvidia
    model:       deepseek-ai/deepseek-v4-flash
    temperature: 0.0
    max_tokens:  1024

  # ── demo-gpt-oss-120b ────────────────────────────────────────────────────────
  # Groq-hosted GPT-OSS-120B (OpenAI's open-weight flagship, 120B params, free tier).
  # Replaces the demoted Qwen3.5 slot (NIM credit pool ruled out NIM for nightly evals;
  # Groq's Qwen3-32B already used as judge — same-family bias disqualifies it here).
  # New vendor lineage in the demo set (OpenAI open-weight). Strong reasoning model;
  # probe 2026-05-18 confirmed clean instruct behavior — no <think> blocks in content.
  # Default medium reasoning effort produces hidden chain-of-thought (not in content),
  # consistent with high coherence scores at free-tier cost.
  # See ADR-0008 amendment for full selection rationale.
  demo-gpt-oss-120b:
    provider:    groq
    model:       openai/gpt-oss-120b
    temperature: 0.0
    max_tokens:  1024
    extra_params:
      reasoning_effort: low  # GPT-OSS-120B hides reasoning by default (~500 tokens).
      # At reasoning_effort=low, hidden reasoning drops to ~10 tokens, freeing budget
      # for the structured tool response. Tested 2026-05-18: with reasoning
      # unconstrained, 4/24 truncation failures; with reasoning_effort=low, 24/24
      # + coherence 4.75.

  # ── demo-qwen ────────────────────────────────────────────────────────────────
  # DEMOTED 2026-05-16: OpenRouter removed qwen/qwen-2.5-72b-instruct:free
  # (HTTP 404 "No endpoints found"). Profile commented out until a replacement
  # free-tier Qwen model is confirmed available. Do not delete — preserves the
  # profile structure for when a replacement model is identified.
  #
  # demo-qwen:
  #   planner:        qwen/qwen-2.5-72b-instruct:free
  #   flight_hunter:  qwen/qwen-2.5-72b-instruct:free
  #   hotel_hunter:   qwen/qwen-2.5-72b-instruct:free
  #   optimizer:      qwen/qwen-2.5-72b-instruct:free
  #   booking:        qwen/qwen-2.5-72b-instruct:free
  #   conversation:   qwen/qwen-2.5-72b-instruct:free
  #   provider:       openrouter

  # ── prod ──────────────────────────────────────────────────────────────────────
  # B2B production profile. Tenants supply their own ANTHROPIC_API_KEY; the SDK
  # authenticates using the tenant key so inference cost is attributed to them.
  # See plan.md §18 open decisions and the Phase E auth ADR (TBD).
  prod:
    planner:        claude-haiku-4-5-20251001
    flight_hunter:  claude-haiku-4-5-20251001
    hotel_hunter:   claude-haiku-4-5-20251001
    optimizer:      claude-haiku-4-5-20251001
    booking:        claude-haiku-4-5-20251001
    conversation:   claude-haiku-4-5-20251001
    provider:       anthropic

  # ── eval ─────────────────────────────────────────────────────────────────────
  # Frontier models for baseline benchmarks. Requires ANTHROPIC_API_KEY.
  # Never active in CI or production — manual baseline runs only.
  eval:
    planner:        claude-sonnet-4-6
    flight_hunter:  claude-haiku-4-5-20251001
    hotel_hunter:   claude-haiku-4-5-20251001
    optimizer:      claude-sonnet-4-6
    booking:        claude-haiku-4-5-20251001
    conversation:   claude-sonnet-4-6
    provider:       anthropic

  # ── eval-judge-qwen3-32b ─────────────────────────────────────────────────────
  # Judge profile for optimizer eval coherence scoring.
  # Substituted from deepseek-r1-distill-llama-70b after Groq
  # decommissioned that model on 2026-05-17.
  # See docs/architecture/adr/0016-llm-judge-design.md.
  #
  # qwen/qwen3-32b deprecated by Groq 2026-08-16 (console.groq.com/docs/
  # deprecations); their docs give ONLY openai/gpt-oss-120b as the documented
  # successor for this specific model (unlike some other deprecations, no
  # same-family Qwen alternative is offered). Substituted here on that basis,
  # but this REOPENS the within-family-bias concern this profile's own name and
  # comments were written to avoid: demo-llama (the profile normally being
  # judged) now also uses openai/gpt-oss-120b for planner/optimizer/
  # conversation (see that profile's own entry above, fixed in the same pass).
  # Judge and judged model are now the same family. Not resolved here --
  # flagging for a real fix (e.g. eval-judge-sonnet for anything judging
  # demo-llama's output) rather than silently keeping a compromised default.
  # Reasoning-tuned (emits <think>...</think> blocks stripped before parsing).
  # Free on Groq free tier. max_tokens 2048 carried over from the Qwen3
  # judge's think-block budget; gpt-oss-120b's own reasoning behavior has not
  # been re-validated against this budget.
  eval-judge-qwen3-32b:
    model:          openai/gpt-oss-120b
    provider:       groq
    temperature:    0.0
    max_tokens:     2048

  # ── eval-judge-sonnet ─────────────────────────────────────────────────────────
  # External-defensible judge for on-demand manual runs. NOT used in CI.
  # Swap via --judge-profile eval-judge-sonnet on the scorer CLI.
  eval-judge-sonnet:
    model:          claude-sonnet-4-6
    provider:       anthropic
    temperature:    0.0
    max_tokens:     512
