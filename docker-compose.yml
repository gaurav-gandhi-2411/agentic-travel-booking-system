services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dealhunter
      POSTGRES_USER: dealhunter
      POSTGRES_PASSWORD: dealhunter_local
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dealhunter"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
